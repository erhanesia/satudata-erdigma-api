spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:satudata}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

# 8082 karena di laptop ini 8080 dipegang Oracle TNS Listener dan 8081 dipakai
# aplikasi Java lain. Ubah lewat SERVER_PORT bila perlu.
server:
  port: ${SERVER_PORT:8082}

logging:
  level:
    id.co.erdigma.satudata: DEBUG

satudata:
  api-key:
    # Nilai pengembangan lokal saja. Aman ter-commit justru KARENA nilainya
    # publik: siapa pun yang membaca repo tahu rahasianya, jadi tidak ada yang
    # tergoda memakainya di luar laptop. Profil prod tidak memuat baris ini,
    # sehingga wajib mengisi env var APIKEY_ENCRYPTION_SECRET atau aplikasi
    # menolak start.
    encryption-secret: ${APIKEY_ENCRYPTION_SECRET:dev-only-not-a-real-secret-satudata}
