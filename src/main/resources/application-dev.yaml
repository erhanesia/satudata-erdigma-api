spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:satudata}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

# 8082 karena di laptop ini 8080 dipegang Oracle TNS Listener dan 8081 dipakai
# aplikasi Java lain. Ubah lewat SERVER_PORT bila perlu.
server:
  port: ${SERVER_PORT:8082}

logging:
  level:
    id.co.erdigma.satudata: DEBUG
