spring:
  # Laptop dan CI memuat data contoh; produksi tidak. Lihat contextFilter pada
  # changeset seed, dan bawaan `prod` di application.yaml.
  liquibase:
    contexts: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:satudata}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

# 8082 karena di laptop ini 8080 dipegang Oracle TNS Listener dan 8081 dipakai
# aplikasi Java lain. Ubah lewat SERVER_PORT bila perlu.
server:
  port: ${SERVER_PORT:8082}

logging:
  level:
    id.co.erdigma.satudata: DEBUG

# Ditimpa di sini, bukan di application.yaml: bawaan di sana menunjuk
# hris.api.zcode.id (produksi). Lokal bicara ke hris dev.
hris:
  base-url: ${HRIS_BASE_URL:https://hris-dev.api.zcode.id/api/v1}
