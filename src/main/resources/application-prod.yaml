spring:
  datasource:
    url: jdbc:postgresql://${PROD_DB_HOST}:${PROD_DB_PORT}/${PROD_DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}

aws:
  cognito:
    region: ${COGNITO_REGION:ap-southeast-1}
    userPoolId: ${COGNITO_USER_POOL_ID}

# Dipin di sini, tidak diwariskan dari application.yaml — bawaan di sana
# menunjuk ke hris-dev. Kalau profil prod ikut mewarisi, satu variabel
# lingkungan yang lupa di-set membuat produksi diam-diam disuplai data (dan
# peran) dari direktori dev.
hris:
  base-url: ${HRIS_BASE_URL:https://hris.api.zcode.id/api/v1}
