# Jejak audit unduhan. Modal persetujuan di desain memuat klausul sanksi
# kebocoran data — klausul itu hanya bisa ditegakkan kalau ada catatan ini.
# Sengaja TIDAK memakai soft delete: baris audit tidak boleh bisa dihapus.
databaseChangeLog:
  - changeSet:
      id: "13"
      author: author
      changes:
        - createTable:
            tableName: download_log
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              # Disimpan sebagai nilai, bukan FK — jejak audit harus tetap utuh
              # walaupun baris user dihapus.
              - column:
                  name: cognito_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: user_name
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: user_email
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: agency_code
                  type: varchar(20)
                  constraints:
                    nullable: true
              - column:
                  name: dataset_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: dataset_slug
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: resource_id
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: file_name
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: size_bytes
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: agreement_accepted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: ip_address
                  type: varchar(64)
                  constraints:
                    nullable: true
              - column:
                  name: user_agent
                  type: varchar(500)
                  constraints:
                    nullable: true
              - column:
                  name: downloaded_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: download_log
            indexName: download_log_dataset_id_index
            columns:
              - column:
                  name: dataset_id
        - createIndex:
            tableName: download_log
            indexName: download_log_cognito_id_index
            columns:
              - column:
                  name: cognito_id
