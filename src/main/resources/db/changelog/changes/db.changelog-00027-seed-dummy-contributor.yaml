# Karyawan dummy yang menjadi PENERBIT dataset contoh.
#
# Sampai sekarang seluruh dataset seed tidak punya pemilik: kolom uploaded_by
# kosong, sehingga panel admin menampilkan "—" pada kolom "Diunggah oleh" dan
# kartu "Kontributor" berisi nol. Tujuh baris ini mengisi kekosongan itu dengan
# orang, bukan dengan angka karangan di layar.
#
# Namanya sengaja mengikuti desain panel admin supaya tangkapan layar desain
# dan aplikasi yang berjalan bisa dibandingkan baris demi baris saat demo.
#
# Catatan tentang job_level: seluruhnya diberi tingkat yang memetakan ke peran
# portal PUBLISHER (lihat changeset 00018), karena mereka memang menerbitkan
# data. Kolom position berisi jabatan fungsionalnya dan memang boleh berbeda
# dari job_level — keduanya sumbu yang berlainan di HRIS.
#
# HAPUS bersama changeset 00010, 00018, dan 00019 saat integrasi HRIS aktif.
databaseChangeLog:
  - changeSet:
      id: "27"
      author: author
      changes:
        - sql:
            splitStatements: false
            sql: |
