# Delapan divisi karangan diganti 32 team Erdigma yang sebenarnya.
#
# ---------------------------------------------------------------------------
# Kenapa
#
# Isi tabel ini sejak changeset 8 disalin dari larik `AGENCIES` di berkas
# desain: DNA, IT, PROD, SALES, FIN, OPS, HR, MKT. Tidak satu pun mencerminkan
# struktur Erdigma. Nama, kode, warna, dan angka penghitungnya sama-sama
# karangan desainer yang membeku jadi data.
#
# Daftar penggantinya diambil dari GET /api/v1/team milik hris-api, sehingga
# `hris_team_id` bisa langsung terisi dan pengguna Cognito yang login otomatis
# mendapat divisinya. Sebelum ini kolom itu kosong untuk kedelapan barisnya,
# yang membuat SETIAP pengguna Cognito berdivisi null dan karena itu tidak bisa
# menerbitkan dataset sama sekali.
#
# ---------------------------------------------------------------------------
# Kode dan warna
#
# HRIS hanya menyimpan id dan nama; kode serta warna milik portal ini sendiri.
#
# Kode disusun sebagai singkatan nama, minimal dua huruf, dan dipakai di tiga
# tempat: teks avatar divisi, nilai filter `?divisions=` di URL, dan label
# ringkas di tabel admin. Tiga di antaranya sengaja tidak mengikuti singkatan
# apa adanya - `ERSP` dan `MKTP` supaya tidak jadi satu huruf, sedangkan
# `GMLT` dan `GMGR` memisahkan Gemilang Multazam dari General Manager yang
# sama-sama menghasilkan `GM`.
#
# Warna dipilih dari id HRIS-nya, bukan dari urutan daftar: urutan bergeser
# begitu ada team baru, sedangkan id tidak. Paletnya delapan warna yang sama
# dengan berkas desain, jadi warnanya berulang antar team - itu diterima,
# karena kode di dalam avatar yang membedakan, bukan warnanya.
#
# ---------------------------------------------------------------------------
# Data lama
#
# Ketiga tabel yang menunjuk `division` dipindahkan lebih dulu, baru kedelapan
# baris lama dihapus. Di produksi pemindahan ini tidak menyentuh apa pun -
# seluruh dataset dan pengguna contoh berpagar `contextFilter: dev`, jadi yang
# tersisa hanya delapan baris kosong yang dihapus. Di laptop, 26 dataset,
# 26 pengguna, dan 1 koleksi ikut berpindah.
#
# Pemetaannya perkiraan dan tidak bisa tepat: DNA dan IT sama-sama jatuh ke
# "Data & IT", sementara SALES dan MKT di HRIS tersebar di belasan team
# berbasis merek. Ini diterima karena yang dipindahkan memang data contoh -
# dataset fiktif yang tidak akan ikut ke produksi.
