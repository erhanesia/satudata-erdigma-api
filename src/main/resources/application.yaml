spring:
  application:
    name: satudata

  # Membaca berkas `.env` di akar modul ini, kalau ada.
  #
  # Tanpa baris ini `.env` HANYA dibaca Docker Compose — dan hanya untuk
  # container Postgres. Variabel yang ditujukan ke aplikasi (profil aktif,
  # HRIS_BASE_URL, COGNITO_*) tidak pernah sampai, sehingga berkasnya tampak
  # mengatur sesuatu padahal separuh isinya diam saja. Itu jebakan yang sudah
  # memakan waktu: setelan diubah, server di-restart, dan tidak terjadi apa-apa.
  #
  # `optional:` wajib. `.env` tidak ikut git, jadi mesin yang belum membuatnya
  # (CI, kontributor baru, container produksi yang memakai variabel lingkungan
  # sungguhan) harus tetap bisa start.
  #
  # `[.properties]` memberi tahu Spring cara membaca berkas tanpa ekstensi:
  # satu `KUNCI=nilai` per baris, `#` sebagai komentar — persis bentuk `.env`.
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${spring_profiles_active:dev}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # User pool yang sama dengan hris-api dan Taskfy — lihat
          # hris-api/src/main/resources/application.properties. Dulu hanya ada
          # di profil prod, sehingga profil dev tanpa auth-dummy tidak bisa
          # start sama sekali.
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.ap-southeast-1.amazonaws.com/ap-southeast-1_9QsfQSnwN}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: false
    # Context WAJIB disebut, dan bawaannya sengaja `prod`.
    #
    # Aturan Liquibase yang mudah menjebak: changeset tanpa context selalu
    # jalan, DAN kalau saat dijalankan tidak ada context yang disebut sama
    # sekali, SELURUH changeset jalan -- termasuk yang bertanda `dev`. Artinya
    # menandai data contoh saja tidak cukup; tanpa baris ini pagarnya diam
    # tidak berfungsi, dan tidak ada galat yang memberi tahu.
    #
    # Bawaan `prod` dipilih supaya lingkungan yang lupa menyetelnya jatuh ke
    # sisi yang aman: data contoh tidak ikut. Profil dev menimpanya.
    contexts: ${LIQUIBASE_CONTEXTS:prod}

  jackson:
    time-zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      # Batas SELURUH permintaan, bukan per berkas. Wajib disetel sejak satu
      # dataset boleh memuat beberapa berkas: bawaan Spring untuk nilai ini juga
      # 10MB, sehingga unggahan tiga berkas @5MB akan ditolak container sebelum
      # kode aplikasi sempat berjalan — dan galatnya tidak menyebut sebab yang
      # sesungguhnya. Angkanya sejalan dengan MAX_TOTAL_BYTES di
      # DatasetUploadService; ubah keduanya bersamaan.
      max-request-size: 40MB

  http:
    clients:
      # Tanpa ini, fallback RestClientException di HrisEmployeeDirectory cuma
      # menyelamatkan kegagalan cepat (mis. connection refused) — hris-api yang
      # menerima koneksi lalu menggantung tetap menahan permintaan itu di
      # dalam rantai filter keamanan sampai kolam worker Tomcat habis, dan
      # portal ini ikut mati.
      connect-timeout: 2s
      read-timeout: 5s

server:
  port: ${SERVER_PORT:8080}
  # Sejak dispatch ERROR diizinkan lewat rantai keamanan (lihat SecurityConfig),
  # halaman galat bawaan Spring bisa sampai ke pemanggil.
  #
  # Dua baris di bawah menegaskan bawaan Spring Boot yang memang sudah "never".
  # Ditulis tegas supaya kalau suatu saat devtools ikut terbawa ke lingkungan
  # non-lokal, jejak tumpukan tidak diam-diam menyala.
  #
  # CATATAN yang sudah diuji: di lokal ini setelan berikut TIDAK berlaku —
  # spring-boot-devtools memaksa include-stacktrace=ALWAYS dan menang atas
  # berkas konfigurasi. Jadi jejak tumpukan memang masih terlihat saat
  # `mvnw spring-boot:run`. Itu perilaku devtools yang disengaja dan hanya
  # terjadi di lokal: devtools ber-scope runtime+optional dan dibuang oleh
  # goal repackage, sehingga tidak ikut ke jar produksi.
  error:
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    # Nama tag diawali angka ("0. Identitas saya", "1. Datasets", ...) supaya
    # urutan alfabet menghasilkan urutan pemakaian: cek identitas dulu, baru
    # katalog, baru sisanya. Tanpa sorter ini urutannya mengikuti urutan
    # pemindaian class — tidak dapat ditebak dan berubah-ubah.
    tags-sorter: alpha
    operations-sorter: method
    # Blok "Try it out" langsung terbuka, tidak perlu diklik satu per satu.
    try-it-out-enabled: true
    # Contoh isian dipakai apa adanya, bukan diganti nilai contoh skema.
    display-request-duration: true

logging:
  pattern:
    console: "%d{yyyy-MMM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{15}) - %msg %n"

custom:
  stage: ${STAGE:dev}

# Asal data karyawan. Selama profil auth-dummy, base-url tidak dipakai.
# Bawaan di sini menunjuk hris-api dev — nilai untuk produksi dipin di
# application-prod.yaml, bukan lewat komentar di berkas ini.
hris:
  base-url: ${HRIS_BASE_URL:https://hris-dev.api.zcode.id/api/v1}

satudata:
  storage:
    # LOCAL atau S3. Setel STORAGE_PROVIDER=LOCAL untuk bekerja tanpa jaringan.
    provider: ${STORAGE_PROVIDER:S3}
    s3:
      # Bucket yang sama dengan hris-api. Kunci dipisah prefix satudata/{stage}/
      # sehingga dev dan prod tidak saling timpa.
      bucket: ${AWS_S3_BUCKET:erhanesia-files}
      region: ${AWS_REGION:ap-southeast-1}

  hris:
    # Alamat dasar berkas milik HRIS — untuk saat ini hanya foto profil karyawan.
    # Bucket-nya sama dengan milik Satu Data dan objeknya bisa dibaca publik,
    # jadi fotonya ditunjuk langsung alih-alih diteruskan lewat aplikasi ini.
    #
    # Yang disimpan di kolom `users.profile_image` cuma path-nya
    # (/hris/dev/profile-image/...); URL utuhnya disusun MeService dari nilai
    # ini. Kalau bucket-nya kelak ditutup dari publik, yang berubah cukup baris
    # ini — front-end tidak perlu tahu apa-apa.
    file-base-url: ${HRIS_FILE_BASE_URL:https://erhanesia-files.s3.ap-southeast-1.amazonaws.com}
