# Deploy produksi satudata-api ke box satudata-prod (satudata.powerhouze.id).
#
# Tidak ada kredensial AWS statis di repo ini: autentikasi memakai OIDC GitHub →
# role `gh-actions-satudata-api-deploy`. Konsekuensinya nama branch ikut
# terpatri di trust policy role tersebut
# (`repo:erhanesia/satudata-erdigma-api:ref:refs/heads/main`) — mengganti nama
# branch berarti memperbarui dua tempat, kalau tidak assume-role gagal dengan
# "Not authorized to perform sts:AssumeRoleWithWebIdentity".
name: Deploy produksi

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dua deploy berbarengan akan saling menimpa tag :prod di ECR dan membuat
# rollback menunjuk image yang salah. Antre, jangan dibatalkan di tengah:
# membatalkan run yang sudah sampai tahap SSM meninggalkan box separuh jalan.
concurrency:
  group: satudata-api-deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: satudata-api
  INSTANCE_NAME: satudata-prod

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # Profil dev (bawaan saat test) menunjuk localhost:5433 — bukan 5432.
      # Lihat application-dev.yaml; angkanya sengaja begitu karena 5432 di
      # laptop pengembang sudah dipegang Postgres native.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: satudata
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - run: mvn -B -ntp test

  deploy:
    name: Build, push, deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag pendek dari commit
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::359475667317:role/gh-actions-satudata-api-deploy
          aws-region: ap-southeast-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push image arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          # Box tujuan t4g = arm64. Tahap Maven di Dockerfile tetap berjalan
          # native di runner amd64 (lihat --platform=$BUILDPLATFORM di sana),
          # jadi baris ini tidak menyeret build ke emulasi QEMU.
          platforms: linux/arm64
          push: true
          # Tanpa ini buildx menerbitkan image index berisi manifest atestasi
          # ber-platform "unknown/unknown". ECR menampilkannya sebagai image
          # tambahan tanpa tag, dan aturan lifecycle "simpan 3 terbaru" ikut
          # menghitungnya — jatah rollback nyata jadi berkurang diam-diam.
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/satudata-api:prod
            ${{ steps.ecr.outputs.registry }}/satudata-api:prod-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy lewat SSM
        run: |
          set -euo pipefail
          CMD=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:Name,Values=${INSTANCE_NAME}" \
            --comment "deploy satudata-api ${{ steps.meta.outputs.sha }}" \
            --timeout-seconds 900 \
            --parameters 'commands=["/usr/local/bin/satudata-deploy.sh satudata-api"]' \
            --query 'Command.CommandId' --output text)
          echo "CommandId=$CMD"

          # send-command hanya berarti perintahnya DITERIMA, bukan selesai.
          # Tanpa penungguan ini workflow selalu hijau — termasuk saat deploy
          # di box gagal dan rollback berjalan.
          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm list-command-invocations --region "$AWS_REGION" \
              --command-id "$CMD" --query 'CommandInvocations[0].Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "--- keluaran box ---"
          aws ssm list-command-invocations --region "$AWS_REGION" --command-id "$CMD" --details \
            --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text || true

          echo "Status akhir: $STATUS"
          [ "$STATUS" = "Success" ]
